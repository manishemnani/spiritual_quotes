name: Fetch daily quote

on:
  schedule:
    # 00:30-17:30 UTC = 06:00-23:00 IST, hourly.
    # fetch.py exits in seconds once today's quote is already stored.
    - cron: "30 0-17 * * *"
  workflow_dispatch:

concurrency:
  group: quote-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: python scraper/fetch.py
        working-directory: scraper

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain quotes latest.json manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quotes latest.json manifest.json
            git commit -m "chore: quote update $(TZ=Asia/Kolkata date +%F)"
            git push
          else
            echo "No changes to commit."
          fi
